# =============================================================================
# infra/docker-compose.yml — Flaw (modèle d'architecture v0.4, chemins infra/)
# -----------------------------------------------------------------------------
# Production mono-serveur : Caddy (HTTPS) -> app (Node.js) -> PostgreSQL 18.
# Les sauvegardes (pg_dump, restic) sont hors de ce fichier : tâche T-042.
#
# Utilisation (depuis infra/) :
#   cp .env.example .env && chmod 600 .env
#   sudo sh creer-secrets.sh
#   docker compose up -d
#
# Seuls les ports 80/443 sont publiés. La base n'est jamais exposée.
# Images épinglées par version ET empreinte (SEC-CONT-01).
# Secrets en fichiers sous /run/secrets (SEC-SECRET-06), propriétaire = UID
# lecteur (G1). Domaine : une seule variable, FLAW_DOMAIN.
# =============================================================================
name: flaw

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: UTC
  PORT: "3000"
  PUBLIC_URL: https://${FLAW_DOMAIN:?FLAW_DOMAIN manquant}
  TRUSTED_ORIGINS: https://${FLAW_DOMAIN}
  TRUSTED_PROXY_CIDR: ${CADDY_IP:-172.31.250.10}/32
  DATABASE_HOST: db
  DATABASE_NAME: ${POSTGRES_DB:-flaw}
  DATABASE_USER: flaw_app
  DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
  BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
  BETTER_AUTH_URL: https://${FLAW_DOMAIN}
  FLAW_KEK_FILE: /run/secrets/flaw_kek
  FLAW_KEK_ID: ${FLAW_KEK_ID:-kek-2026-10}
  RECOVERY_PEPPER_FILE: /run/secrets/recovery_pepper
  RECOVERY_PEPPER_ID: ${RECOVERY_PEPPER_ID:-pep-2026-10}
  HMAC_PEPPER_FILE: /run/secrets/hmac_pepper
  HMAC_PEPPER_ID: ${HMAC_PEPPER_ID:-pep-hmac-2026-10}
  RECOVERY_PEPPER_OLD_IDS: ${RECOVERY_PEPPER_OLD_IDS:-}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
  FLAW_AUTH_BEARER_ENABLED: "${FLAW_AUTH_BEARER_ENABLED:-false}"
  SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-30}
  SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-90}
  SESSION_REVALIDATE_SECONDS: ${SESSION_REVALIDATE_SECONDS:-30}
  MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-10}
  MAX_WS_MESSAGE_MB: ${MAX_WS_MESSAGE_MB:-10}
  EXPORT_TIMEOUT_SECONDS: ${EXPORT_TIMEOUT_SECONDS:-60}
  EXPORT_MAX_CONCURRENCY: ${EXPORT_MAX_CONCURRENCY:-1}
  EXPORT_MAX_RSS_MB: ${EXPORT_MAX_RSS_MB:-900}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-15}
  TEMP_PASSWORD_TTL_HOURS: 24
  TRASH_RETENTION_DAYS: 30
  SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-30}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

services:
  caddy:
    <<: *defaults
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FLAW_DOMAIN: ${FLAW_DOMAIN:?FLAW_DOMAIN manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 100
    depends_on:
      app:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: ${CADDY_IP:-172.31.250.10}

  migrate:
    <<: *defaults
    restart: "no"
    image: ${FLAW_IMAGE:?FLAW_IMAGE manquant}
    # Migrations Drizzle (T-005) sous flaw_owner.
    # db_owner_password est 10001:70 mode 440 : migrate (UID 10001) le lit en
    # propriétaire, db (GID 70) le lit par le groupe. L'app ne le reçoit pas.
    command: ["node", "apps/server/src/db/migrate.ts"]
    user: "10001:10001"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-flaw}
      DATABASE_USER: flaw_owner
      DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    <<: *defaults
    image: ${FLAW_IMAGE:?FLAW_IMAGE manquant}
    user: "10001:10001"
    environment: *app-env
    # Anciens poivres : un slot RECOVERY_OLD_PEPPER_N par id de
    # RECOVERY_PEPPER_OLD_IDS. Vide → le fichier courant est remonté sous un
    # nom que l'application n'ouvre pas. Renseigné → /run/secrets/recovery_pepper_<id>,
    # uniquement sur app (ni migrate, ni db).
    secrets:
      - app_db_password
      - better_auth_secret
      - flaw_kek
      - recovery_pepper
      - hmac_pepper
      - source: old_recovery_pepper_1
        target: ${RECOVERY_OLD_PEPPER_1:+recovery_pepper_}${RECOVERY_OLD_PEPPER_1:-old_pepper_slot_1}
      - source: old_recovery_pepper_2
        target: ${RECOVERY_OLD_PEPPER_2:+recovery_pepper_}${RECOVERY_OLD_PEPPER_2:-old_pepper_slot_2}
      - source: old_recovery_pepper_3
        target: ${RECOVERY_OLD_PEPPER_3:+recovery_pepper_}${RECOVERY_OLD_PEPPER_3:-old_pepper_slot_3}
      - source: old_recovery_pepper_4
        target: ${RECOVERY_OLD_PEPPER_4:+recovery_pepper_}${RECOVERY_OLD_PEPPER_4:-old_pepper_slot_4}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    pids_limit: 200
    expose:
      - "3000"
    healthcheck:
      # dist/server/healthcheck.js arrive avec l'écoute applicative (T-003).
      # La sonde API-023 est src/platform/healthz.ts.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal
    mem_limit: 1536m

  db:
    <<: *defaults
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flaw}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets: [postgres_password, app_db_password, db_owner_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 128m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    mem_limit: 512m

  # Sauvegardes locales (T-042) : dump vérifié toutes les 6 h, surveillance chaque heure.
  # La copie hors site restic (Scaleway) se branche ici quand le bucket existe.
  backup:
    <<: *defaults
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "70:70"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        n=0
        while true; do
          if [ $$((n % 6)) -eq 0 ]; then sh /opt/flaw/backup.sh || true; fi
          sh /opt/flaw/check.sh || true
          n=$$((n + 1))
          sleep 3600
        done
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-flaw}
      PGUSER: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    secrets: [postgres_password]
    volumes:
      - ./backup:/opt/flaw:ro
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 256m

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_db_password:
    file: ./secrets/app_db_password
  db_owner_password:
    file: ./secrets/db_owner_password
  better_auth_secret:
    file: ./secrets/better_auth_secret
  flaw_kek:
    file: ./secrets/flaw_kek
  recovery_pepper:
    file: ./secrets/recovery_pepper
  hmac_pepper:
    file: ./secrets/hmac_pepper
  old_recovery_pepper_1:
    file: ./secrets/${RECOVERY_OLD_PEPPER_1:+recovery_pepper_}${RECOVERY_OLD_PEPPER_1:-recovery_pepper}
  old_recovery_pepper_2:
    file: ./secrets/${RECOVERY_OLD_PEPPER_2:+recovery_pepper_}${RECOVERY_OLD_PEPPER_2:-recovery_pepper}
  old_recovery_pepper_3:
    file: ./secrets/${RECOVERY_OLD_PEPPER_3:+recovery_pepper_}${RECOVERY_OLD_PEPPER_3:-recovery_pepper}
  old_recovery_pepper_4:
    file: ./secrets/${RECOVERY_OLD_PEPPER_4:+recovery_pepper_}${RECOVERY_OLD_PEPPER_4:-recovery_pepper}

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}
  internal:
    internal: true

volumes:
  backups: {}
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
