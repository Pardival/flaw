# T-003 — CI bloquante sur chaque push et chaque pull request.
# SEC-SUPPLY-01 install déterministe, SEC-WEB-07 lint, AC-092 licences,
# SEC-SUPPLY-03 audit, SEC-SECRET-02 gitleaks, SEC-SUPPLY-04 Semgrep.
# CodeQL (SEC-SUPPLY-04) seulement lorsque le dépôt est public.
# SEC-GOV-03 (tests d'auth, ZAP préproduction) n'est pas dans ce workflow :
# aucune cible de préproduction ni test SEC-API-01/02 n'est défini.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: install, lint, typecheck, vitest, licences, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Installation déterministe
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: gawk pour la parité SEC-SECRET-07
        run: sudo apt-get update && sudo apt-get install -y gawk

      # Q-012 — le compteur DB_TESTS_EXECUTED est vérifié, pas seulement le code de sortie.
      - name: Vitest et tests node:test
        run: |
          set -euo pipefail
          set +e
          pnpm test | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          set -e
          count="$(grep -oE 'DB_TESTS_EXECUTED=[0-9]+' "$RUNNER_TEMP/test.log" | tail -1 | cut -d= -f2 || true)"
          if [ -z "${count}" ] || [ "${count}" -lt 12 ]; then
            echo "DB_TESTS_EXECUTED insuffisant: ${count:-absent}"
            exit 1
          fi
          echo "DB_TESTS_EXECUTED=${count}"
          exit "${status}"

      # A-015 — openapi.json est généré depuis Zod et commité.
      # oasdiff signale une rupture entre main et la tête. Les ajouts compatibles passent.
      - name: oasdiff
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C "$HOME/.local/bin" oasdiff
          git fetch --depth=1 origin main
          git show FETCH_HEAD:openapi.json > /tmp/openapi.base.json
          "$HOME/.local/bin/oasdiff" breaking --fail-on ERR /tmp/openapi.base.json openapi.json

      - name: Licences
        run: pnpm licenses:check

      - name: Audit des dépendances
        run: node scripts/check-audit.mjs

  image:
    name: build image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: flaw-ci-${{ github.run_id }}
      FLAW_DOMAIN: localhost
      ACME_EMAIL: ci@example.com
      FLAW_IMAGE: flaw-app:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de l'image serveur
        run: docker build -f apps/server/Dockerfile -t flaw-app:ci .

      - name: healthz HTTPS via Caddy
        working-directory: infra
        run: |
          set -euo pipefail
          sudo sh creer-secrets.sh
          docker compose up -d --wait
          body="$(curl -fsS --retry 12 --retry-delay 2 --retry-all-errors -k --resolve localhost:443:127.0.0.1 https://localhost/api/v1/healthz)"
          printf '%s\n' "$body"
          printf '%s\n' "$body" | grep -q '"status":"ok"'
          if printf '%s\n' "$body" | grep -q '"version"'; then
            echo "healthz divulgue une version"
            exit 1
          fi

      - name: Nettoyage compose
        if: always()
        working-directory: infra
        run: docker compose down -v

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer gitleaks 8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks
        run: gitleaks detect --source . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"

      - name: Preuve allowlist gitleaks
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json"
          raw = report.read_text(encoding="utf-8").strip()
          data = json.loads(raw) if raw else []
          findings = data if isinstance(data, list) else data.get("findings", [])
          if findings:
              print(f"gitleaks : {len(findings)} fuite(s).")
              raise SystemExit(1)
          print("gitleaks : aucune fuite.")
          PY
          tmp="$(mktemp -d)"
          cp .gitleaks.toml "$tmp/.gitleaks.toml"
          python3 - "$tmp" << 'PY'
          import json, pathlib, secrets, string, subprocess, sys
          tmp = pathlib.Path(sys.argv[1])
          marker = "MARQUEUR" + "CONNEXION9f3a"
          hex_value = "0123456789abcde" + "f0123456789abcdef"
          (tmp / "markers.test.ts").write_text(
              f'const secret = "{hex_value}";\nconst token = "{marker}";\n',
              encoding="utf-8",
          )
          (tmp / "markers.ts").write_text(
              f'const secret = "{hex_value}";\n',
              encoding="utf-8",
          )
          config = str(tmp / ".gitleaks.toml")
          def scan(source, report):
              proc = subprocess.run(
                  [
                      "gitleaks", "detect", "--no-git",
                      "--source", str(source),
                      "--config", config,
                      "--redact", "--no-banner",
                      "--report-format", "json",
                      "--report-path", str(report),
                  ],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              raw = report.read_text(encoding="utf-8").strip() if report.exists() else ""
              data = json.loads(raw) if raw else []
              findings = data if isinstance(data, list) else []
              return proc.returncode, findings, proc.stderr
          status, findings, err = scan(tmp / "markers.test.ts", tmp / "markers.json")
          if status != 0 or findings:
              print(err)
              print("allowlist : un marqueur dans un .test.ts a été signalé.")
              raise SystemExit(1)
          status, findings, err = scan(tmp / "markers.ts", tmp / "plain.json")
          if status == 0 or not findings:
              print(err)
              print("allowlist : un marqueur hors .test.ts aurait dû être signalé.")
              raise SystemExit(1)
          alphabet = string.ascii_uppercase + string.digits
          access = "AKIA" + "".join(secrets.choice(alphabet) for _ in range(16))
          secret = "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(40))
          leak = tmp / "leak.test.ts"
          leak.write_text(
              "\n".join([
                  f"aws_access_key_id={access}",
                  f"aws_secret_access_key={secret}",
                  f'const token = "{marker}";',
                  f'const secret = "{hex_value}";',
                  "",
              ]),
              encoding="utf-8",
          )
          status, findings, err = scan(leak, tmp / "leak.json")
          if status == 0 or not findings:
              print(err)
              print("SEC-SECRET-02 : un vrai secret dans un .test.ts aurait dû être détecté.")
              raise SystemExit(1)
          for item in findings:
              if item.get("StartLine") in {3, 4}:
                  print("marqueur signalé", item.get("RuleID"), item.get("StartLine"))
                  raise SystemExit(1)
          print("SEC-SECRET-02 : vrai secret détecté dans un .test.ts, marqueurs ignorés.")
          PY

      - name: Preuve SEC-SECRET-02
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" config user.email "ci@example.com"
          git -C "$tmp" config user.name "ci"
          python3 -c 'import pathlib,secrets,string,sys; root=pathlib.Path(sys.argv[1]); alphabet=string.ascii_uppercase+string.digits; access="AKIA"+"".join(secrets.choice(alphabet) for _ in range(16)); secret="".join(secrets.choice(string.ascii_letters+string.digits) for _ in range(40)); (root/"leak.env").write_text("aws_access_key_id=%s\naws_secret_access_key=%s\n" % (access, secret), encoding="utf-8")' "$tmp"
          git -C "$tmp" add leak.env
          git -C "$tmp" commit -q -m "commit de test SEC-SECRET-02"
          if gitleaks detect --source "$tmp" --redact --no-banner; then
            echo "SEC-SECRET-02 : le commit de test aurait dû être bloqué."
            exit 1
          fi
          echo "SEC-SECRET-02 : commit de test bloqué."

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Image officielle semgrep/semgrep 1.180.0, épinglée par digest.
      SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # p/default est actif : pnpm-workspace.yaml fixe minimumReleaseAge (10080),
      # trustPolicy (no-downgrade), trustPolicyIgnoreAfter (525600) et
      # blockExoticSubdeps. renovate.json fixe minimumReleaseAge à 7 days.
      - name: Semgrep
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config p/default \
              --config .github/semgrep/sec-web-07.yml \
              --config .github/semgrep/sec-db-03.yml \
              --config .github/semgrep/sec-db-03-complement.yml \
              --config .github/semgrep/auth-tables.yml \
              --error \
              --metrics=off \
              --exclude 'fixtures/**' \
              --exclude 'apps/server/src/db/sec-db-03-proof.ts'

      - name: Preuve SEC-WEB-07
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '%s\n' 'const el = {};' 'const doc = { title: "t" };' 'el.innerHTML = doc.title;' > "$tmp/sample.js"
          out="$(docker run --rm \
            -v "$tmp:/work" \
            -v "${GITHUB_WORKSPACE}/.github/semgrep:/rules:ro" \
            -w /work \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config /rules/sec-web-07.yml --error --metrics=off /work/sample.js 2>&1 || true)"
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -q 'sec-web-07-dom-sink'; then
            echo "SEC-WEB-07 : el.innerHTML = doc.title aurait dû être signalé."
            exit 1
          fi
          echo "SEC-WEB-07 : el.innerHTML = doc.title signalé."

      - name: Preuve SEC-DB-03
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cat > "$tmp/bad.ts" << 'END'
          declare const db: { query: (...args: unknown[]) => unknown; execute: (...args: unknown[]) => unknown };
          declare function sql(strings: TemplateStringsArray, ...values: unknown[]): unknown;
          declare namespace sql { function raw(value: unknown): unknown; function identifier(value: unknown): unknown; }
          const user = "u";
          const table = "t";
          db.query("SELECT " + user);
          db.query(`SELECT ${user}`);
          db.execute(sql.raw(user));
          db.query(`SELECT ${sql.identifier(table)} WHERE name = ${user}`);
          END
          out="$(docker run --rm \
            -v "$tmp:/work" \
            -v "${GITHUB_WORKSPACE}/.github/semgrep:/rules:ro" \
            -w /work \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config /rules/sec-db-03.yml --error --metrics=off /work/bad.ts 2>&1 || true)"
          printf '%s\n' "$out"
          for rule in sec-db-03-query-concat sec-db-03-query-template sec-db-03-sql-raw; do
            if ! printf '%s\n' "$out" | grep -q "$rule"; then
              echo "SEC-DB-03 : $rule aurait dû signaler le cas."
              exit 1
            fi
          done
          cat > "$tmp/ok.ts" << 'END'
          declare const db: { query: (...args: unknown[]) => unknown; execute: (...args: unknown[]) => unknown };
          declare function sql(strings: TemplateStringsArray, ...values: unknown[]): unknown;
          declare namespace sql { function identifier(value: unknown): unknown; }
          const user = "u";
          const table = "t";
          const schema = "s";
          const params = [user];
          db.query("SELECT current_user");
          db.query("SELECT * FROM users WHERE id = $1", params);
          db.execute(sql`SELECT ${user}`);
          db.query(`SELECT ${sql.identifier(table)}`);
          db.query(`SELECT ${sql.identifier(schema)}.${sql.identifier(table)}`);
          db.execute(`SELECT ${sql.identifier(table)}`, params);
          END
          docker run --rm \
            -v "$tmp:/work" \
            -v "${GITHUB_WORKSPACE}/.github/semgrep:/rules:ro" \
            -w /work \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config /rules/sec-db-03.yml --error --metrics=off /work/ok.ts
          echo 'SEC-DB-03 : concaténation, template et sql.raw signalés ; sql`` et sql.identifier autorisés.'

      - name: Preuve SEC-DB-03 complément
        run: |
          set -euo pipefail
          report="$(mktemp)"
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config .github/semgrep/sec-db-03-complement.yml \
              --json \
              --metrics=off \
              --quiet \
              apps/server/src/db/sec-db-03-proof.ts > "$report"
          set -e
          python3 - "$report" apps/server/src/db/sec-db-03-proof.ts << 'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          report = json.loads(raw) if raw else {}
          source = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          order = []
          starts = {}
          for index, line in enumerate(source, 1):
              if line.startswith("export async function "):
                  name = line.split("(", 1)[0].split()[-1]
                  starts[name] = index
                  order.append(name)
          ranges = {}
          for index, name in enumerate(order):
              end = starts[order[index + 1]] - 1 if index + 1 < len(order) else len(source)
              ranges[name] = (starts[name], end)
          results = report.get("results", [])
          def hits(name):
              start, end = ranges[name]
              return [item for item in results if start <= item["start"]["line"] <= end]
          failed = False
          for name in ("bad1", "bad2", "bad3", "bad4"):
              found = hits(name)
              ids = sorted({item["check_id"].rsplit(".", 1)[-1] for item in found})
              print(f"{name}: {ids or 'AUCUN'}")
              if not found:
                  failed = True
          for name in ("ok1", "ok2", "ok3", "ok4"):
              found = hits(name)
              if found:
                  ids = sorted({item["check_id"].rsplit(".", 1)[-1] for item in found})
                  print(f"{name}: signalé à tort {ids}")
                  failed = True
              else:
                  print(f"{name}: non signalé")
          if failed:
              raise SystemExit(1)
          print("SEC-DB-03 complément : bad1…bad4 signalés, ok1…ok4 non signalés.")
          PY

      - name: Preuve auth-tables
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/apps/server/src/auth" "$tmp/apps/server/src/other"
          printf '%s\n' 'export async function bad(): Promise<void> { await db.query("SELECT 1 FROM flaw.users"); }' > "$tmp/apps/server/src/other/bad.ts"
          printf '%s\n' 'export async function ok(): Promise<void> { await db.query("SELECT 1 FROM flaw.users"); }' > "$tmp/apps/server/src/auth/ok.ts"
          bad="$(docker run --rm \
            -v "$tmp:/work" \
            -v "${GITHUB_WORKSPACE}/.github/semgrep:/rules:ro" \
            -w /work \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config /rules/auth-tables.yml --error --metrics=off /work/apps/server/src/other/bad.ts 2>&1 || true)"
          printf '%s\n' "$bad"
          if ! printf '%s\n' "$bad" | grep -q 'auth-tables-only-auth-module'; then
            echo "auth-tables : une requête hors auth/ aurait dû être signalée."
            exit 1
          fi
          docker run --rm \
            -v "$tmp:/work" \
            -v "${GITHUB_WORKSPACE}/.github/semgrep:/rules:ro" \
            -w /work \
            -e SEMGREP_SEND_METRICS=off \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config /rules/auth-tables.yml --error --metrics=off /work/apps/server/src/auth/ok.ts
          echo "auth-tables : requête hors auth/ signalée, module auth/ autorisé."

  codeql:
    name: codeql
    if: github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
