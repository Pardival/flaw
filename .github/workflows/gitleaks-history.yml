# Historique complet : toutes les branches et tous les tags.
# Déclenché chaque nuit et à chaque push sur main.
name: gitleaks-history

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks toutes branches et tags
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Installer gitleaks 8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # git log --all parcourt refs/heads et refs/tags. --full-history garde les parents.
      - name: gitleaks
        run: gitleaks detect --source . --log-opts="--full-history --all" --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"

      - name: Preuve aucune fuite
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json"
          raw = report.read_text(encoding="utf-8").strip()
          data = json.loads(raw) if raw else []
          findings = data if isinstance(data, list) else data.get("findings", [])
          if findings:
              print(f"gitleaks : {len(findings)} fuite(s).")
              raise SystemExit(1)
          print("gitleaks : aucune fuite sur l'ensemble des branches et des tags.")
          PY
