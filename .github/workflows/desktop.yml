# Application de bureau : construction Mac (universelle Intel + Apple Silicon) et
# Windows, puis publication dans GitHub Releases sur un tag desktop-v*.
# Lancement manuel possible : les fichiers restent alors en artefacts du workflow.
# Les noms publiés sont stables (Flaw-mac.dmg, Flaw-windows.exe) pour que la page
# de téléchargement pointe toujours vers releases/latest/download/.
# Pas de signature payante : macOS reçoit une signature ad hoc (Gatekeeper avertit).
name: desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: construire (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: windows
            os: windows-2022
            targets: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Rust stable et cibles
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}

      - name: Version du tag = version de l'application
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#desktop-v}"
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "$tag" = "$app" || { echo "Tag $tag ≠ version $app de tauri.conf.json"; exit 1; }

      - name: Installation déterministe
        run: pnpm install --frozen-lockfile

      - name: Tests de la coquille Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Construire
        working-directory: apps/desktop
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Rassembler sous des noms stables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.name }}" = "mac" ]; then
            cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Flaw-mac.dmg
          else
            cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe out/Flaw-windows.exe
          fi
          cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done

      - name: Artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaw-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publication:
    name: publier la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Récupérer les fichiers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          cat > notes.md <<NOTES
          Flaw ${version} pour ordinateur : 100 % local, sans compte ni connexion.

          - **Mac** (Intel et Apple Silicon, macOS 11 ou plus récent) : \`Flaw-mac.dmg\`
          - **Windows** (10 et 11, 64 bits) : \`Flaw-windows.exe\`

          Premier lancement : l'application n'est pas signée par un certificat payant.
          Sur Mac, ouvrez Réglages Système › Confidentialité et sécurité › « Ouvrir quand même ».
          Sur Windows, cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          Les empreintes SHA-256 sont fournies à côté de chaque fichier.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flaw ${version}" \
            --notes-file notes.md
