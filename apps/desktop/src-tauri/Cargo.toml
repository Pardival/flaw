[package]
name = "flaw-desktop"
version = "0.1.1"
description = "Flaw : écrire sans distraction, sur une vraie page de livre."
authors = ["Kevin Dufour"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "flaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
